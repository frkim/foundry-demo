[project]
name = "foundry-demo"
version = "1.0.0"
description = "Foundry Guide - Microsoft Foundry Agent Service demo API (FastAPI)"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "pydantic-settings>=2.15.0",
    "azure-identity>=1.26.0",
    "azure-ai-projects>=2.8.0,<3",
    "openai>=3.22.1",
    "azure-monitor-opentelemetry>=1.8.11",
    "opentelemetry-instrumentation-openai-v2>=2.4b0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "ruff>=0.16.9",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foundry_demo"]

[[tool.uv.index]]
name = "msft-pypi-proxy"
url = "https://packagefeedproxy.microsoft.io/pypi/simple"
default = true

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "S", "PT", "RET", "PTH", "TID"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["azure.monitor.*", "opentelemetry.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
