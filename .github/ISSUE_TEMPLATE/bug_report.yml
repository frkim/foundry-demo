name: Bug report
description: Report something that does not work as expected.
title: "fix: <short description>"
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. **Do not report security vulnerabilities here** — follow SECURITY.md instead.
        Never paste secrets, tokens, or connection strings.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Demo app — API (src/api)
        - Demo app — web (src/web)
        - Infrastructure (infra)
        - GitHub Actions workflows
        - Slide deck (docs/presentations)
        - Session docs (docs/session)
        - Video pipeline (scripts/video)
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ...
        2. Open ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Relevant output, with secrets removed.
      render: text
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Local or Azure, OS, browser, commit SHA.
