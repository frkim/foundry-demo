version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: /src/api
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      python:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /src/web
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      web:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /docs/presentations
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      presentations:
        patterns:
          - "*"
