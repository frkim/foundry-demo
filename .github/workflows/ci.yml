name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Package downloads go through the Microsoft-protected Central Feed Services proxy (never public registries).
  UV_DEFAULT_INDEX: https://packagefeedproxy.microsoft.io/pypi/simple
  UV_PYTHON_DOWNLOADS: never
  npm_config_registry: https://packagefeedproxy.microsoft.io/npm/

jobs:
  api:
    name: api (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: src/api/.python-version
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: src/api/uv.lock
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy src
      - run: uv run --frozen pytest

  web:
    name: web (Vue)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://packagefeedproxy.microsoft.io/npm/
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  infra:
    name: infra (Bicep lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: az bicep install
      - run: az bicep lint --file infra/main.bicep
      - run: az bicep build --file infra/main.bicep --stdout > /dev/null
      - run: az bicep build-params --file infra/main.dev.bicepparam --stdout > /dev/null

  infra-what-if:
    name: infra (validate + what-if)
    # Runs only when OIDC is configured (repository variables) and never for pull requests from forks.
    if: vars.AZURE_CLIENT_ID != '' && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
    needs: infra
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'swedencentral' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Validate
        run: >
          az deployment sub validate --location "$AZURE_LOCATION"
          --name "foundrydemo-validate-${GITHUB_RUN_ID}"
          --template-file infra/main.bicep --parameters infra/main.dev.bicepparam
          --parameters location="$AZURE_LOCATION"
      - name: What-if
        run: >
          az deployment sub what-if --location "$AZURE_LOCATION"
          --name "foundrydemo-whatif-${GITHUB_RUN_ID}"
          --template-file infra/main.bicep --parameters infra/main.dev.bicepparam
          --parameters location="$AZURE_LOCATION"

  deck:
    name: deck (Marp)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs/presentations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://packagefeedproxy.microsoft.io/npm/
          cache: npm
          cache-dependency-path: docs/presentations/package-lock.json
      - run: npm ci
      - run: npm run build:html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deck-html
          path: docs/presentations/dist/
          if-no-files-found: error
          retention-days: 7

  docker:
    name: docker (build only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image (no push)
        run: docker build --file src/Dockerfile --tag "foundry-demo:${GITHUB_SHA}" src
